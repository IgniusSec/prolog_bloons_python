<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <!-- aplica tema -->
    <script>
      const theme = localStorage.getItem("darkMode");
      if (theme === "enabled") {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>

    <!-- tailwind CDN com config inline correta -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-gray-900 dark:bg-gray-800 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Prolog UI</h1>

            <div class="flex items-center space-x-4">
                <a href="{% url 'home' %}" class="hover:text-gray-300">Home</a>
                <a href="#" class="hover:text-gray-300">Consultas</a>
                <a href="{% url 'base-dados' %}" class="hover:text-gray-300">Base de dados</a>

                <!-- Toggle -->
                <button id="theme-toggle"
                        onclick="toggleDark()"
                        class="bg-gray-700 px-3 py-1 rounded hover:bg-gray-600 transition">
                    🌙
                </button>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <main class="flex-grow container mx-auto p-6">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 dark:bg-gray-800 text-white text-center p-4">
        <p>© 2026 - Interface Prolog com Django</p>
    </footer>

    <!-- Scripts -->
    <script>
        function toggleDark() {
            const html = document.documentElement;
            const btn = document.getElementById("theme-toggle");

            const isDark = html.classList.toggle("dark");

            localStorage.setItem("darkMode", isDark ? "enabled" : "disabled");

            if (btn) {
                btn.textContent = isDark ? "☀️" : "🌙";
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const btn = document.getElementById("theme-toggle");
            const isDark = document.documentElement.classList.contains("dark");

            if (btn) {
                btn.textContent = isDark ? "☀️" : "🌙";
            }
        });
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
