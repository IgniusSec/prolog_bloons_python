{% extends "base.html" %}

{% block title %}Base de dados{% endblock %}

{% block content %}

<!-- Header -->
<section class="mb-6">
  <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">
    Editar Base Prolog
  </h2>
  <p class="text-gray-600 dark:text-gray-400">
    Modifique a base de conhecimento e salve para recarregar o motor Prolog.
  </p>
</section>

<!-- Card Editor -->
<section class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md">

  <form method="POST" class="flex flex-col gap-4">
    {% csrf_token %}

    <!-- Label -->
    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
      Conteúdo da base (.pl)
    </label>

    <!-- Textarea -->
    <textarea
      name="conteudo"
      rows="25"
      spellcheck="false"
      class="w-full font-mono text-sm border border-gray-300 dark:border-gray-600 
             rounded-xl p-4 
             focus:outline-none focus:ring-2 focus:ring-blue-500 
             bg-gray-50 dark:bg-gray-900 
             text-gray-900 dark:text-gray-100"
    >{{ conteudo }}</textarea>

    <!-- Actions -->
    <div class="flex justify-between items-center">

      <span class="text-sm text-gray-500 dark:text-gray-400">
        Alterações serão aplicadas imediatamente após salvar.
      </span>

      <button
        type="submit"
        class="bg-blue-600 text-white px-6 py-2 rounded-xl 
               hover:bg-blue-700 transition shadow-sm"
      >
        Salvar alterações
      </button>

    </div>
  </form>

</section>

{% endblock content %}
